
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Ingestion Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #ingestionResult {
            margin-top: 15px;
            color: #333;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 12px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .user {
            font-weight: bold;
        }

        .ai {
            font-weight: bold;
            color: #2563eb;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .hint {
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 15px;
            }

            .chat-input {
                flex-direction: column;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 7px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Data Ingestion Assistant</h1>

    <div class="subtitle">
        FastAPI + SQLite + Ollama + RAG
    </div>

    <!-- DATA INGESTION -->

    <div class="card">

        <h2>Data Ingestion</h2>

        <p>Upload a PDF file to extract its text for AI retrieval.</p>

        <input
            type="file"
            id="fileInput"
            accept=".pdf,application/pdf"
        >

        <br><br>

        <button id="uploadButton" onclick="uploadFile()">
            Upload &amp; Ingest
        </button>

        <div id="ingestionResult" role="status" aria-live="polite"></div>

    </div>

    <!-- AI ASSISTANT -->

    <div class="card">

        <h2>AI Assistant</h2>

        <div
            id="chatBox"
            class="chat-box"
            aria-live="polite"
        ></div>

        <div class="chat-input">

            <input
                type="text"
                id="question"
                placeholder="Ask about your uploaded PDF or ingestion system..."
                onkeydown="handleEnter(event)"
            >

            <button id="sendButton" onclick="askAI()">
                Send
            </button>

        </div>

    </div>

    <!-- INGESTION HISTORY -->

    <div class="card">

        <h2>Recent Ingestion Runs</h2>

        <button onclick="loadRuns()">Refresh</button>

        <br><br>

        <table>

            <thead>
                <tr>
                    <th>Run</th>
                    <th>Status</th>
                    <th>Total</th>
                    <th>Success</th>
                    <th>Failed</th>
                </tr>
            </thead>

            <tbody id="runsTable"></tbody>

        </table>

    </div>

</div>

<script>
    const API_URL = "http://127.0.0.1:8000";


    // Upload a PDF and display the extracted text.
    async function uploadFile() {
        const fileInput = document.getElementById("fileInput");
        const result = document.getElementById("ingestionResult");
        const uploadButton = document.getElementById("uploadButton");

        if (!fileInput.files.length) {
            result.innerText = "Please select a PDF file first.";
            return;
        }

        const file = fileInput.files[0];

        if (!file.name.toLowerCase().endsWith(".pdf")) {
            result.innerText = "Please select a PDF file.";
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        uploadButton.disabled = true;
        result.innerText = `Uploading ${file.name} and extracting text...`;

        try {
            const response = await fetch(`${API_URL}/upload`, {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.detail || `Upload failed: HTTP ${response.status}`
                );
            }

            const preview =
                data.extracted_text_preview ??
                data.text ??
                "(The backend did not return a text preview.)";

            result.innerText =
                `Success: ${data.filename}\n\n` +
                `Message: ${data.message}\n\n` +
                `Pages: ${data.pages ?? "Not provided"}\n` +
                `Characters extracted: ${data.characters_extracted ?? 0}\n\n` +
                `Extracted text preview:\n${preview}`;

            console.log("Upload response:", data);

        } catch (error) {
            result.innerText = `Upload error: ${error.message}`;
            console.error("Upload failed:", error);

        } finally {
            uploadButton.disabled = false;
        }
    }


    // Ask the AI assistant a question.
    async function askAI() {
        const input = document.getElementById("question");
        const sendButton = document.getElementById("sendButton");

        const question = input.value.trim();

        if (!question) {
            return;
        }

        addMessage("You", question);
        input.value = "";

        sendButton.disabled = true;

        try {
            const response = await fetch(`${API_URL}/ai/chat`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    question: question
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.detail || `AI request failed: HTTP ${response.status}`
                );
            }

            addMessage(
                "AI",
                data.answer || "The AI assistant returned no answer."
            );

        } catch (error) {
            addMessage("AI", `Error: ${error.message}`);
            console.error("AI request failed:", error);

        } finally {
            sendButton.disabled = false;
            input.focus();
        }
    }


    // Safely display chat messages as text.
    function addMessage(sender, message) {
        const chatBox = document.getElementById("chatBox");

        const div = document.createElement("div");
        div.className = "message";

        const label = document.createElement("span");
        label.className = sender === "You" ? "user" : "ai";
        label.textContent = `${sender}: `;

        const content = document.createElement("span");
        content.textContent = String(message ?? "");

        div.appendChild(label);
        div.appendChild(content);

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }


    // Send a question when Enter is pressed.
    function handleEnter(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            askAI();
        }
    }


    // Load recent ingestion runs.
    async function loadRuns() {
        const table = document.getElementById("runsTable");

        try {
            const response = await fetch(`${API_URL}/ingestion-runs`);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const runs = await response.json();

            table.replaceChildren();

            if (!Array.isArray(runs) || runs.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");

                cell.colSpan = 5;
                cell.textContent = "No ingestion runs found.";

                row.appendChild(cell);
                table.appendChild(row);
                return;
            }

            runs.slice(0, 5).forEach(run => {
                const row = document.createElement("tr");

                [
                    run.run_id,
                    run.status,
                    run.total_sources,
                    run.successful_sources,
                    run.failed_sources
                ].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = String(value ?? "-");
                    row.appendChild(cell);
                });

                table.appendChild(row);
            });

        } catch (error) {
            console.error("Unable to load ingestion runs:", error);

            table.replaceChildren();

            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 5;
            cell.textContent = "Unable to load ingestion history.";

            row.appendChild(cell);
            table.appendChild(row);
        }
    }


    // Load history when the page opens.
    loadRuns();
</script>

</body>
</html>
